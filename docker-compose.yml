services:
  postgres:
    image: postgres:16
    container_name: creativeinsight-postgres
    environment:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: creativeinsight
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: creativeinsight-redis
    ports:
      - "6379:6379"

volumes:
  pg_data:
